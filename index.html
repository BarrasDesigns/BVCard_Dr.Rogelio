<!DOCTYPE html>
<html lang="es-MX">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dr. Rogelio Carranza | BVCard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- FontAwesome (Redes Sociales) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        ubuntu: ['Ubuntu', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            primary: '#231a9a',   // Azul Principal
                            secondary: '#312975', // Azul Oscuro
                            accent: '#ffffff'     // Blanco
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 font-ubuntu antialiased min-h-screen flex justify-center pb-10">

    <!-- Contenedor Principal Tap-It (Max 430px simula pantalla móvil) -->
    <main class="w-full max-w-[430px] bg-white min-h-screen shadow-2xl relative overflow-hidden">

        <!-- Cabecera / Cover Photo en Fondo Gris -->
        <header class="h-40 bg-slate-200 relative rounded-b-[2.5rem] shadow-sm overflow-hidden p-4">
            <!-- Logo a la derecha como marca de agua / elemento decorativo -->
            <div class="absolute top-3 right-4 h-32 w-32 opacity-90 pointer-events-none">
                <img src="./images/Logo2.png" alt="Medicina Biológica y Regenerativa Logo"
                    class="h-full w-full object-contain">
            </div>
        </header>

        <!-- Sección de Perfil: Foto a la izquierda, Texto a la derecha -->
        <section class="px-6 relative z-10 -mt-16 mb-6">
            <div class="flex flex-row items-end gap-4">

                <!-- Foto del Doctor (Izquierda, ajustada más abajo) -->
                <div
                    class="relative w-28 h-28 shrink-0 rounded-full p-1 bg-gradient-to-tr from-brand-primary via-brand-secondary to-indigo-500 shadow-xl pulse-border mt-2">
                    <div class="w-full h-full rounded-full border-2 border-white overflow-hidden bg-white">
                        <img src="./images/foto1.png" alt="Dr. Rogelio Carranza" class="w-full h-full object-cover"
                            onerror="this.src='https://ui-avatars.com/api/?name=Rogelio+Carranza&background=231a9a&color=fff&size=150'">
                    </div>
                </div>

                <!-- Título y Texto (Derecha) -->
                <div class="text-left pb-1 flex-1">
                    <h1 class="text-xl font-bold text-gray-800 leading-tight">Dr. Rogelio Carranza</h1>
                    <p class="text-xs font-bold text-brand-primary uppercase tracking-wide mt-1">
                        Medicina Biológica Regenerativa
                    </p>
                    <p class="text-gray-500 text-[10px] font-medium mt-1 tracking-wider leading-tight">
                        REGENERAR <span>•</span> RESTAURAR <span>•</span> OPTIMIZAR
                    </p>
                </div>
            </div>

            <!-- Botones Core (Acciones Tap-It) -->
            <div class="w-full flex gap-3 mt-6">
                <button id="btnSaveContact"
                    class="flex-1 bg-brand-primary text-white py-3 rounded-xl font-semibold shadow-lg shadow-brand-primary/30 hover:bg-brand-secondary transition flex justify-center items-center gap-2 text-sm">
                    <i class="fa-solid fa-user-plus"></i> Guardar
                </button>
                <button id="btnShare"
                    class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-xl font-semibold shadow-sm hover:bg-gray-200 transition flex justify-center items-center gap-2 text-sm">
                    <i class="fa-solid fa-share-nodes"></i> Compartir
                </button>
            </div>
        </section>

        <!-- Cuadrícula de Redes Sociales Centradas -->
        <section class="px-6 mb-8">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4 text-center">Conecta Conmigo</h2>
            <div class="flex items-center justify-center gap-4 w-full">
                <!-- WhatsApp -->
    <a href="https://wa.me/528111576796"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="WhatsApp"
       class="social-btn flex-1 max-w-[80px] h-14 flex items-center justify-center rounded-xl bg-green-50 text-green-600 hover:bg-green-500 hover:text-white transition shadow-sm">
        <i class="fa-brands fa-whatsapp text-2xl"></i>
    </a>

    <!-- Instagram -->
    <a href="https://www.instagram.com/rcarranzag/"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Instagram"
       class="social-btn flex-1 max-w-[80px] h-14 flex items-center justify-center rounded-xl bg-pink-50 text-pink-600 hover:bg-pink-500 hover:text-white transition shadow-sm">
        <i class="fa-brands fa-instagram text-2xl"></i>
    </a>

    <!-- Facebook -->
    <a href="https://www.facebook.com/rcarranzag"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Facebook"
       class="social-btn flex-1 max-w-[80px] h-14 flex items-center justify-center rounded-xl bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white transition shadow-sm">
        <i class="fa-brands fa-facebook-f text-2xl"></i>
    </a>

    <!-- TikTok -->
    <a href="https://www.tiktok.com/@rogeliocarranza10"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="TikTok"
       class="social-btn flex-1 max-w-[80px] h-14 flex items-center justify-center rounded-xl bg-slate-100 text-slate-800 hover:bg-slate-900 hover:text-white transition shadow-sm">
        <i class="fa-brands fa-tiktok text-2xl"></i>
    </a>

    <!-- YouTube -->
    <a href="https://www.youtube.com/@rcarranzag"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="YouTube"
       class="social-btn flex-1 max-w-[80px] h-14 flex items-center justify-center rounded-xl bg-red-50 text-red-600 hover:bg-red-600 hover:text-white transition shadow-sm">
        <i class="fa-brands fa-youtube text-2xl"></i>
    </a>                <!-- 
                <a href="#"
                    class="social-btn flex-1 max-w-[80px] h-14 flex items-center justify-center rounded-xl bg-brand-primary/10 text-brand-primary hover:bg-brand-primary hover:text-white transition shadow-sm">
                    <i class="fa-solid fa-calendar-check text-2xl"></i>
                </a> 
                -->
            </div>
        </section>
        <!-- Ubicación del Consultorio -->
        <section class="px-6 mb-8">
            <a href="https://maps.app.goo.gl/aGuRnTpVSEsGXrcTA" target="_blank" rel="noopener noreferrer"
                class="link-card group flex items-center p-3 bg-gray-50 rounded-xl hover:bg-gray-100 transition border border-gray-100">
                <div
                    class="bg-red-100 p-3 rounded-lg text-red-600 group-hover:bg-red-500 group-hover:text-white transition">
                    <i class="fa-solid fa-map-location-dot"></i>
                </div>
                <span class="font-medium text-gray-700 ml-3 text-sm">Ubicación del Consultorio</span>
                <i class="fa-solid fa-arrow-up-right-from-square ml-auto text-gray-300 text-sm"></i>
            </a>
        </section>

        <!-- Enlaces de Servicios y Productos -->
        <section class="px-6 mb-10 space-y-3">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">Servicios</h2>

            <!-- Servicio 1 -->
            <div
                class="link-card group flex items-center p-3 bg-gray-50 rounded-xl hover:bg-gray-100 transition border border-gray-100">
                <div class="bg-brand-primary/10 p-3 rounded-lg text-brand-primary transition">
                    <i class="fa-solid fa-dna"></i>
                </div>
                <span class="font-medium text-gray-700 ml-3 text-sm">Infiltración de PRP y médula ósea, rodilla y
                    hombro</span>
                <!-- <i class="fa-solid fa-chevron-right ml-auto text-gray-300 text-sm"></i> -->
                </div>

            <!-- Servicio 2 -->
            <div
                class="link-card group flex items-center p-3 bg-gray-50 rounded-xl hover:bg-gray-100 transition border border-gray-100">
                <div class="bg-brand-secondary/10 p-3 rounded-lg text-brand-secondary transition">
                    <i class="fa-solid fa-flask"></i>
                </div>
                <span class="font-medium text-gray-700 ml-3 text-sm">PRP autólogo</span>
                <!-- <i class="fa-solid fa-arrow-up-right-from-square ml-auto text-gray-300 text-sm"></i> -->
            </div>

            <!-- Servicio 3 -->
            <div
                class="link-card group flex items-center p-3 bg-gray-50 rounded-xl hover:bg-gray-100 transition border border-gray-100">
                <div class="bg-brand-primary/10 p-3 rounded-lg text-brand-primary transition">
                    <i class="fa-solid fa-user-doctor"></i>
                </div>
                <span class="font-medium text-gray-700 ml-3 text-sm">Aminoácidos de cada órgano</span>
                <!-- <i class="fa-solid fa-arrow-up-right-from-square ml-auto text-gray-300 text-sm"></i> -->
            </div>

            <!-- Servicio 4 -->
            <div
                class="link-card group flex items-center p-3 bg-gray-50 rounded-xl hover:bg-gray-100 transition border border-gray-100">
                <div class="bg-brand-primary/10 p-3 rounded-lg text-brand-primary transition">
                    <i class="fa-solid fa-leaf"></i>
                </div>
                <span class="font-medium text-gray-700 ml-3 text-sm">Productos herbarios / Células madre</span>
                <!-- <i class="fa-solid fa-arrow-up-right-from-square ml-auto text-gray-300 text-sm"></i> -->
            </div>
        </section>

    </main>

    <script src="/js/app.js"></script>
</body>

</html>
